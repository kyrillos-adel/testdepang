name: Deploy Angular App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install angular-cli-ghpages
        run: npm install -g angular-cli-ghpages

      - name: Build Angular App
        run: npm run build -- --configuration production
        # This will build to the 'docs' folder as specified in angular.json

      - name: Create .nojekyll file
        run: touch docs/.nojekyll
        # This prevents GitHub from ignoring files that start with underscores

      - name: Deploy with angular-cli-ghpages
        run: npx angular-cli-ghpages --dir=docs --name="GitHub Actions" --email=actions@github.com --no-silent --message="Deploy to GitHub pages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
